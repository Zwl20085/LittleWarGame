<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Little War roadmap from 0.4 through 3.0 to planned 3.x milestones">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe5c8"/>
      <stop offset="55%" stop-color="#e4d6b3"/>
      <stop offset="100%" stop-color="#d8c79e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2b2114" stop-opacity="0.28"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6e5d41" stroke-width="0.6" stroke-opacity="0.22"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.17  0 0 0 0 0.10  0 0 0 0.06 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <style>
      .t-head { font: 700 13px 'Courier New', monospace; letter-spacing: 2.5px; fill: #4a3d28; }
      .t-ver  { font: 700 15px 'Georgia', serif; fill: #f7f0dc; }
      .t-ver-now { font: 700 16px 'Georgia', serif; fill: #fff8e6; }
      .t-ver-plan { font: 700 14px 'Georgia', serif; fill: #3a3326; }
      .t-title { font: 700 13px 'Georgia', serif; fill: #2b2318; }
      .t-sub  { font: 11.5px 'Georgia', serif; fill: #4d402c; }
      .t-tag  { font: 700 9.5px 'Courier New', monospace; letter-spacing: 1.2px; }
      @keyframes marchRoad {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulseBeacon {
        0%, 100% { r: 28px; stroke-opacity: 0.75; }
        50% { r: 35px; stroke-opacity: 0.15; }
      }
      .planned-road {
        animation: marchRoad 2.4s linear infinite;
      }
      .beacon-ring {
        animation: pulseBeacon 2.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Paper base -->
  <rect width="1200" height="320" rx="6" fill="url(#paper)"/>
  <rect width="1200" height="320" rx="6" fill="url(#grid)"/>

  <!-- Topographic contour lines -->
  <g fill="none" stroke="#8a7553" stroke-opacity="0.22" stroke-width="1">
    <path d="M -20 60 Q 140 20, 290 75 T 620 55 T 960 80 T 1220 45"/>
    <path d="M -20 82 Q 150 42, 300 95 T 630 75 T 970 100 T 1220 65"/>
    <path d="M -20 260 Q 220 295, 440 245 T 880 270 T 1220 240"/>
    <path d="M -20 278 Q 220 312, 445 265 T 885 288 T 1220 258"/>
  </g>

  <!-- River -->
  <path d="M 480 -10 C 460 70, 520 120, 495 190 C 470 255, 520 290, 505 330" fill="none" stroke="#7fa0a6" stroke-width="10" stroke-opacity="0.35"/>
  <path d="M 480 -10 C 460 70, 520 120, 495 190 C 470 255, 520 290, 505 330" fill="none" stroke="#4f6d73" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="6 4"/>

  <rect width="1200" height="320" rx="6" fill="url(#vignette)"/>
  <rect x="8" y="8" width="1184" height="304" rx="4" fill="none" stroke="#4a3d28" stroke-width="1.5" stroke-opacity="0.55"/>
  <rect x="12" y="12" width="1176" height="296" rx="2" fill="none" stroke="#4a3d28" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- Header -->
  <text x="28" y="34" class="t-head">CAMPAIGN ROAD · 0.4 → 3.0.3 → 3.x</text>
  <g transform="translate(880, 22)">
    <circle cx="0" cy="6" r="5" fill="#3a3326"/>
    <text x="10" y="10" class="t-tag" fill="#3a3326">SHIPPED</text>
    <circle cx="82" cy="6" r="6" fill="#a63f36" stroke="#f7f0dc" stroke-width="1.5"/>
    <text x="94" y="10" class="t-tag" fill="#a63f36">THIS RELEASE</text>
    <circle cx="198" cy="6" r="5" fill="#efe5c8" stroke="#6b7a3a" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="210" y="10" class="t-tag" fill="#4f5d28">PLANNED</text>
  </g>

  <!-- The road: shipped solid ink, planned dashed -->
  <path id="shippedRoad" d="M 65 170 C 125 140, 145 140, 185 165 S 265 195, 305 170 S 385 135, 425 160 S 505 195, 545 170 S 625 135, 665 160 S 745 195, 785 168 S 865 140, 910 165"
        fill="none" stroke="#2b2318" stroke-width="9" stroke-linecap="round" stroke-opacity="0.18"/>
  <path d="M 65 168 C 125 138, 145 138, 185 163 S 265 193, 305 168 S 385 133, 425 158 S 505 193, 545 168 S 625 133, 665 158 S 745 193, 785 166 S 865 138, 910 163"
        fill="none" stroke="#3a3326" stroke-width="4" stroke-linecap="round"/>

  <!-- Animated supply convoy / staff courier moving along the shipped road -->
  <circle r="4" fill="#a63f36" stroke="#fff8e6" stroke-width="1.2">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 65 168 C 125 138, 145 138, 185 163 S 265 193, 305 168 S 385 133, 425 158 S 505 193, 545 168 S 625 133, 665 158 S 745 193, 785 166 S 865 138, 910 163"/>
  </circle>

  <path class="planned-road" d="M 910 163 C 965 188, 1005 188, 1045 163 S 1110 140, 1145 163"
        fill="none" stroke="#6b7a3a" stroke-width="3.2" stroke-dasharray="7 6" stroke-linecap="round"/>
  <!-- Arrow head at end -->
  <path d="M 1140 156 L 1154 163 L 1140 170" fill="none" stroke="#6b7a3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Shipped stops ===== -->
  <!-- 0.4 (below) -->
  <g transform="translate(65, 168)">
    <line x1="0" y1="16" x2="0" y2="44" stroke="#3a3326" stroke-width="1.2"/>
    <circle r="15" fill="#3a3326" stroke="#f7f0dc" stroke-width="2"/>
    <text y="5" text-anchor="middle" class="t-ver">0.4</text>
    <text y="60" text-anchor="middle" class="t-title">First diorama</text>
    <text y="76" text-anchor="middle" class="t-sub">20 Hz sim · convoys</text>
    <text y="90" text-anchor="middle" class="t-sub">territory economy</text>
  </g>

  <!-- 0.5 (above) -->
  <g transform="translate(185, 163)">
    <line x1="0" y1="-16" x2="0" y2="-44" stroke="#3a3326" stroke-width="1.2"/>
    <circle r="15" fill="#3a3326" stroke="#f7f0dc" stroke-width="2"/>
    <text y="5" text-anchor="middle" class="t-ver">0.5</text>
    <text y="-82" text-anchor="middle" class="t-title">Operations</text>
    <text y="-66" text-anchor="middle" class="t-sub">fieldworks · trucks</text>
    <text y="-52" text-anchor="middle" class="t-sub">doctrines</text>
  </g>

  <!-- 1.0 (below) -->
  <g transform="translate(305, 168)">
    <line x1="0" y1="16" x2="0" y2="44" stroke="#3a3326" stroke-width="1.2"/>
    <circle r="15" fill="#3a3326" stroke="#f7f0dc" stroke-width="2"/>
    <text y="5" text-anchor="middle" class="t-ver">1.0</text>
    <text y="60" text-anchor="middle" class="t-title">Living battlefield</text>
    <text y="76" text-anchor="middle" class="t-sub">soldier motion · cover</text>
    <text y="90" text-anchor="middle" class="t-sub">orchestral score</text>
  </g>

  <!-- 1.1 (above) -->
  <g transform="translate(425, 158)">
    <line x1="0" y1="-16" x2="0" y2="-44" stroke="#3a3326" stroke-width="1.2"/>
    <circle r="15" fill="#3a3326" stroke="#f7f0dc" stroke-width="2"/>
    <text y="5" text-anchor="middle" class="t-ver">1.1</text>
    <text y="-82" text-anchor="middle" class="t-title">Artillery &amp; sieges</text>
    <text y="-66" text-anchor="middle" class="t-sub">capital defence</text>
    <text y="-52" text-anchor="middle" class="t-sub">capitals-only win</text>
  </g>

  <!-- 2.0 (below) -->
  <g transform="translate(545, 168)">
    <line x1="0" y1="16" x2="0" y2="44" stroke="#3a3326" stroke-width="1.2"/>
    <circle r="15" fill="#3a3326" stroke="#f7f0dc" stroke-width="2"/>
    <text y="5" text-anchor="middle" class="t-ver">2.0</text>
    <text y="60" text-anchor="middle" class="t-title">High Command</text>
    <text y="76" text-anchor="middle" class="t-sub">commanders · bunkers</text>
    <text y="90" text-anchor="middle" class="t-sub">spearheads · labs</text>
  </g>

  <!-- 2.1 (above) -->
  <g transform="translate(665, 158)">
    <line x1="0" y1="-16" x2="0" y2="-44" stroke="#3a3326" stroke-width="1.2"/>
    <circle r="15" fill="#3a3326" stroke="#f7f0dc" stroke-width="2"/>
    <text y="5" text-anchor="middle" class="t-ver">2.1</text>
    <text y="-82" text-anchor="middle" class="t-title">Fortress warfare</text>
    <text y="-66" text-anchor="middle" class="t-sub">fortified lines · 8 fronts</text>
    <text y="-52" text-anchor="middle" class="t-sub">town streets &amp; models</text>
  </g>

  <!-- 2.2 (below) -->
  <g transform="translate(785, 166)">
    <line x1="0" y1="16" x2="0" y2="44" stroke="#3a3326" stroke-width="1.2"/>
    <circle r="15" fill="#3a3326" stroke="#f7f0dc" stroke-width="2"/>
    <text y="5" text-anchor="middle" class="t-ver">2.2</text>
    <text y="60" text-anchor="middle" class="t-title">Economic warfare</text>
    <text y="76" text-anchor="middle" class="t-sub">one directive · town depots</text>
    <text y="90" text-anchor="middle" class="t-sub">factories &amp; raids · 60 fps</text>
  </g>

  <!-- ===== Current release: 3.0 / 3.0.3 (above, highlighted) ===== -->
  <g transform="translate(910, 163)">
    <line x1="0" y1="-25" x2="0" y2="-44" stroke="#a63f36" stroke-width="2"/>
    <circle class="beacon-ring" r="28" fill="none" stroke="#a63f36" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle r="22" fill="#a63f36" stroke="#fff8e6" stroke-width="2.5"/>
    <!-- small star above -->
    <polygon points="0,-36 2.5,-30 9,-30 4,-26 6,-20 0,-24 -6,-20 -4,-26 -9,-30 -2.5,-30" fill="#a63f36"/>
    <text y="5" text-anchor="middle" class="t-ver-now">3.0</text>
    <rect x="-82" y="-122" width="164" height="74" rx="4" fill="#f7eed3" stroke="#a63f36" stroke-width="1.6"/>
    <text y="-103" text-anchor="middle" class="t-title" fill="#a63f36">3.0 · Clash of Doctrines</text>
    <text y="-87" text-anchor="middle" class="t-sub">4 AI doctrines · front echelons</text>
    <text y="-73" text-anchor="middle" class="t-sub">roads &amp; rail · zones · fortresses</text>
    <text y="-59" text-anchor="middle" class="t-sub">3.0.3 war ledger &amp; fast sim</text>
  </g>

  <!-- ===== Planned stops ===== -->
  <!-- 3.x (below) -->
  <g transform="translate(1045, 163)">
    <line x1="0" y1="16" x2="0" y2="44" stroke="#6b7a3a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle r="15" fill="#efe5c8" stroke="#6b7a3a" stroke-width="2.2" stroke-dasharray="4 2"/>
    <text y="5" text-anchor="middle" class="t-ver-plan">3.x</text>
    <text y="60" text-anchor="middle" class="t-title">Next fronts</text>
    <text y="76" text-anchor="middle" class="t-sub">war pace · river assaults</text>
    <text y="90" text-anchor="middle" class="t-sub">harder AI · save &amp; replay</text>
  </g>

  <!-- 3.x+ (above) -->
  <g transform="translate(1145, 163)">
    <line x1="0" y1="-16" x2="0" y2="-44" stroke="#6b7a3a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle r="15" fill="#efe5c8" stroke="#6b7a3a" stroke-width="2.2" stroke-dasharray="4 2"/>
    <text y="5" text-anchor="middle" class="t-ver-plan">···</text>
    <text y="-82" text-anchor="middle" class="t-title">Beyond</text>
    <text y="-66" text-anchor="middle" class="t-sub">multi-map campaigns</text>
    <text y="-52" text-anchor="middle" class="t-sub">achievements · modding</text>
  </g>
</svg>
