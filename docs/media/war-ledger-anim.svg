<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Animated war-room figure showing the clickable dispatch log camera jump on the left and the post-match War Ledger timeline curves on the right">
  <defs>
    <linearGradient id="wl-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe5c8"/>
      <stop offset="55%" stop-color="#e4d6b3"/>
      <stop offset="100%" stop-color="#d8c79e"/>
    </linearGradient>
    <radialGradient id="wl-vignette" cx="50%" cy="50%" r="68%">
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2b2114" stop-opacity="0.26"/>
    </radialGradient>
    <pattern id="wl-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#6e5d41" stroke-width="0.55" stroke-opacity="0.2"/>
    </pattern>
    <style>
      .h-mono { font: 700 12.5px 'Courier New', monospace; letter-spacing: 2.2px; fill: #4a3d28; }
      .sub-mono { font: 700 10px 'Courier New', monospace; letter-spacing: 1px; fill: #5a4b32; }
      .card-title { font: 700 13.5px 'Georgia', serif; fill: #2b2318; }
      .log-txt { font: 11.5px 'Courier New', monospace; fill: #ede4d0; }
      .log-time { font: 700 11px 'Courier New', monospace; fill: #c89b3c; }
      .axis-txt { font: 10px 'Courier New', monospace; fill: #a99b82; }
      .badge-txt { font: 700 10px 'Courier New', monospace; letter-spacing: 0.8px; }

      @keyframes drawCurve {
        0% { stroke-dashoffset: 560; }
        65%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes rowHighlight1 {
        0%, 45%, 100% { fill-opacity: 0.08; stroke-opacity: 0.2; }
        10%, 38% { fill-opacity: 0.32; stroke-opacity: 0.95; }
      }
      @keyframes rowHighlight2 {
        0%, 45% { fill-opacity: 0.08; stroke-opacity: 0.2; }
        55%, 88% { fill-opacity: 0.32; stroke-opacity: 0.95; }
        100% { fill-opacity: 0.08; stroke-opacity: 0.2; }
      }
      @keyframes reticlePulse {
        0%, 100% { transform: scale(0.92); opacity: 0.85; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      .curve-anim {
        stroke-dasharray: 560;
        animation: drawCurve 6s ease-in-out infinite;
      }
      .row-1 { animation: rowHighlight1 7s ease-in-out infinite; }
      .row-2 { animation: rowHighlight2 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Parchment background -->
  <rect width="1200" height="340" rx="6" fill="url(#wl-paper)"/>
  <rect width="1200" height="340" rx="6" fill="url(#wl-grid)"/>
  <rect width="1200" height="340" rx="6" fill="url(#wl-vignette)"/>
  <rect x="8" y="8" width="1184" height="324" rx="4" fill="none" stroke="#4a3d28" stroke-width="1.5" stroke-opacity="0.55"/>
  <rect x="12" y="12" width="1176" height="316" rx="2" fill="none" stroke="#4a3d28" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- Center divider -->
  <line x1="590" y1="24" x2="590" y2="316" stroke="#4a3d28" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.55"/>

  <!-- ================= LEFT PANEL: CLICKABLE DISPATCH LOG & CAMERA JUMP ================= -->
  <g transform="translate(26, 28)">
    <text x="0" y="10" class="h-mono">I. INTERACTIVE TELEGRAPH LOG · CLICK TO PAN CAMERA</text>
    <text x="0" y="27" class="sub-mono">EVERY BATTLEFIELD DISPATCH RESOLVES ITS SETTLEMENT, FRONT, OR TARGET COORDINATES</text>

    <!-- Dark War-Room Dispatch Card -->
    <rect x="0" y="40" width="286" height="238" rx="5" fill="#1f1b16" stroke="#6e5d41" stroke-width="1.5"/>
    <rect x="0" y="40" width="286" height="28" rx="5" fill="#2c251d"/>
    <text x="12" y="58" class="badge-txt" fill="#e2d5b5">HIGH COMMAND DISPATCHES (LIVE)</text>
    <circle cx="268" cy="54" r="4" fill="#c86458">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Row 1: Spearhead at Oakhaven -->
    <g transform="translate(10, 78)">
      <rect class="row-1" x="0" y="0" width="266" height="44" rx="3" fill="#c89b3c" stroke="#e2b857" stroke-width="1.2"/>
      <text x="8" y="17" class="log-time">12:40</text>
      <text x="50" y="17" class="log-txt" fill="#8fa8c8">[1st Corps]</text>
      <text x="132" y="17" class="log-txt">Spearhead →</text>
      <text x="8" y="34" class="log-txt" fill="#f3e7c9">Oakhaven (5 tanks + 3 motorised)</text>
      <text x="236" y="17" class="badge-txt" fill="#e2b857">↗ PAN</text>
    </g>

    <!-- Row 2: Infiltration Alert near Millbrook -->
    <g transform="translate(10, 130)">
      <rect class="row-2" x="0" y="0" width="266" height="44" rx="3" fill="#c86458" stroke="#e07a6d" stroke-width="1.2"/>
      <text x="8" y="17" class="log-time">14:15</text>
      <text x="50" y="17" class="log-txt" fill="#e07a6d">[Alert]</text>
      <text x="104" y="17" class="log-txt">Raiders spotted near</text>
      <text x="8" y="34" class="log-txt" fill="#f3e7c9">Millbrook Depot · QRF dispatched</text>
      <text x="236" y="17" class="badge-txt" fill="#e07a6d">↗ PAN</text>
    </g>

    <!-- Row 3: Static recent log -->
    <g transform="translate(10, 182)">
      <rect x="0" y="0" width="266" height="40" rx="3" fill="#2b241c" fill-opacity="0.6" stroke="#5a4b32" stroke-width="0.8"/>
      <text x="8" y="16" class="log-time">15:02</text>
      <text x="50" y="16" class="log-txt" fill="#88b87a">[Eng]</text>
      <text x="92" y="16" class="log-txt">Fortress completed at</text>
      <text x="8" y="32" class="log-txt" fill="#bfb296">Ironbridge Ridge · garrisoned</text>
    </g>

    <!-- Row 4: Static recent log -->
    <g transform="translate(10, 228)">
      <rect x="0" y="0" width="266" height="40" rx="3" fill="#2b241c" fill-opacity="0.6" stroke="#5a4b32" stroke-width="0.8"/>
      <text x="8" y="16" class="log-time">15:48</text>
      <text x="50" y="16" class="log-txt" fill="#d4af37">[HQ]</text>
      <text x="86" y="16" class="log-txt">Upgrade researched:</text>
      <text x="8" y="32" class="log-txt" fill="#bfb296">Full Motorisation · squads mount trucks</text>
    </g>

    <!-- Tactical Mini-Viewport showing camera panning between Oakhaven and Millbrook -->
    <g transform="translate(302, 40)">
      <rect x="0" y="0" width="244" height="238" rx="5" fill="#23291f" stroke="#6e5d41" stroke-width="1.5"/>
      <!-- River and roads inside tactical map -->
      <path d="M 0 140 Q 90 115, 145 150 T 244 130" fill="none" stroke="#4f6d73" stroke-width="9" stroke-opacity="0.55"/>
      <path d="M 35 220 L 82 68 L 195 178" fill="none" stroke="#9e8862" stroke-width="2.2" stroke-dasharray="4 3"/>

      <!-- Node A: Oakhaven -->
      <g transform="translate(82, 68)">
        <circle r="9" fill="#a63f36" stroke="#f7f0dc" stroke-width="1.5"/>
        <text x="14" y="-4" class="badge-txt" fill="#f7f0dc">OAKHAVEN</text>
        <text x="14" y="8" class="axis-txt" fill="#d8b98a">Spearhead · 8 units</text>
      </g>

      <!-- Node B: Millbrook Depot -->
      <g transform="translate(172, 178)">
        <circle r="8" fill="#4b729f" stroke="#f7f0dc" stroke-width="1.5"/>
        <text x="-78" y="22" class="badge-txt" fill="#f7f0dc">MILLBROOK DEPOT</text>
        <text x="-78" y="34" class="axis-txt" fill="#e07a6d">Infiltration alert!</text>
      </g>

      <!-- Animated Camera Viewport Reticle jumping from Oakhaven (82,68) to Millbrook (172,178) -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="82,68; 82,68; 172,178; 172,178; 82,68"
          keyTimes="0; 0.42; 0.54; 0.90; 1"
          dur="7s" repeatCount="indefinite"/>
        <rect x="-34" y="-24" width="68" height="48" rx="3" fill="none" stroke="#e2b857" stroke-width="1.8" stroke-dasharray="6 3"/>
        <circle r="16" fill="none" stroke="#e2b857" stroke-width="1.2" stroke-opacity="0.8"/>
        <line x1="-22" y1="0" x2="-10" y2="0" stroke="#e2b857" stroke-width="1.5"/>
        <line x1="10" y1="0" x2="22" y2="0" stroke="#e2b857" stroke-width="1.5"/>
        <line x1="0" y1="-18" x2="0" y2="-8" stroke="#e2b857" stroke-width="1.5"/>
        <line x1="0" y1="8" x2="0" y2="18" stroke="#e2b857" stroke-width="1.5"/>
      </g>

      <rect x="8" y="8" width="148" height="20" rx="3" fill="#171410" fill-opacity="0.82"/>
      <text x="14" y="22" class="badge-txt" fill="#e2b857">CAMERA: RIG.LOOKAT(X, Z)</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: POST-MATCH WAR LEDGER TIMELINE ================= -->
  <g transform="translate(612, 28)">
    <text x="0" y="10" class="h-mono">II. WAR LEDGER TIMELINE · SETTLEMENTS · ARMY VALUE · INCOME</text>
    <text x="0" y="27" class="sub-mono">SAMPLED EVERY 30S IN WORKER · FORWARDED ON COMPLETION · INTERACTIVE CANVAS CHART</text>

    <!-- Ledger Dark Frame -->
    <rect x="0" y="40" width="560" height="238" rx="5" fill="#181512" stroke="#6e5d41" stroke-width="1.5"/>

    <!-- Mode Switcher Pills -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="96" height="22" rx="3" fill="#c89b3c"/>
      <text x="48" y="15" text-anchor="middle" class="badge-txt" fill="#181512">ARMY VALUE</text>

      <rect x="104" y="0" width="96" height="22" rx="3" fill="#2b241c" stroke="#5a4b32" stroke-width="1"/>
      <text x="152" y="15" text-anchor="middle" class="badge-txt" fill="#bfb296">SETTLEMENTS</text>

      <rect x="208" y="0" width="84" height="22" rx="3" fill="#2b241c" stroke="#5a4b32" stroke-width="1"/>
      <text x="250" y="15" text-anchor="middle" class="badge-txt" fill="#bfb296">INCOME</text>

      <!-- Faction Legend -->
      <g transform="translate(316, 4)">
        <circle cx="0" cy="7" r="4.5" fill="#5b8bd4"/>
        <text x="9" y="11" class="axis-txt" fill="#dcd2be">Blue</text>
        <circle cx="52" cy="7" r="4.5" fill="#cf5c50"/>
        <text x="61" y="11" class="axis-txt" fill="#dcd2be">Red</text>
        <circle cx="100" cy="7" r="4.5" fill="#6da862"/>
        <text x="109" y="11" class="axis-txt" fill="#dcd2be">Green</text>
        <circle cx="158" cy="7" r="4.5" fill="#d4a74a"/>
        <text x="167" y="11" class="axis-txt" fill="#dcd2be">Gold</text>
      </g>
    </g>

    <!-- Chart Grid Area -->
    <g transform="translate(46, 88)">
      <!-- Horizontal grid lines -->
      <line x1="0" y1="0" x2="492" y2="0" stroke="#3a3228" stroke-width="0.8"/>
      <line x1="0" y1="40" x2="492" y2="40" stroke="#3a3228" stroke-width="0.8"/>
      <line x1="0" y1="80" x2="492" y2="80" stroke="#3a3228" stroke-width="0.8"/>
      <line x1="0" y1="120" x2="492" y2="120" stroke="#3a3228" stroke-width="0.8"/>
      <line x1="0" y1="156" x2="492" y2="156" stroke="#6e5d41" stroke-width="1.2"/>

      <!-- Y Axis Labels -->
      <text x="-8" y="4" text-anchor="end" class="axis-txt">18k</text>
      <text x="-8" y="44" text-anchor="end" class="axis-txt">13k</text>
      <text x="-8" y="84" text-anchor="end" class="axis-txt">8k</text>
      <text x="-8" y="124" text-anchor="end" class="axis-txt">4k</text>
      <text x="-8" y="158" text-anchor="end" class="axis-txt">0</text>

      <!-- X Axis Labels -->
      <text x="0" y="174" text-anchor="middle" class="axis-txt">0m</text>
      <text x="123" y="174" text-anchor="middle" class="axis-txt">10m</text>
      <text x="246" y="174" text-anchor="middle" class="axis-txt">20m</text>
      <text x="369" y="174" text-anchor="middle" class="axis-txt">30m</text>
      <text x="492" y="174" text-anchor="middle" class="axis-txt">40m</text>

      <!-- Faction 4 (Gold - Steamroller rushed early, eliminated at 24m) -->
      <path class="curve-anim" d="M 0 132 L 60 105 L 120 82 L 180 96 L 240 128 L 295 156"
            fill="none" stroke="#d4a74a" stroke-width="2.4" stroke-linecap="round"/>

      <!-- Faction 3 (Green - Fortress attrition, steady middle) -->
      <path class="curve-anim" d="M 0 132 L 60 118 L 120 104 L 180 92 L 240 84 L 310 78 L 380 94 L 440 124 L 492 156"
            fill="none" stroke="#6da862" stroke-width="2.4" stroke-linecap="round"/>

      <!-- Faction 2 (Red - Methodical, peaks mid-war then pushed back) -->
      <path class="curve-anim" d="M 0 132 L 60 112 L 120 90 L 180 68 L 240 52 L 310 44 L 380 62 L 440 88 L 492 110"
            fill="none" stroke="#cf5c50" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Faction 1 (Blue - Boom & Expand -> decisive armoured spearheads) -->
      <path class="curve-anim" d="M 0 132 L 60 122 L 120 98 L 180 74 L 240 58 L 310 34 L 380 20 L 440 12 L 492 6"
            fill="none" stroke="#5b8bd4" stroke-width="3" stroke-linecap="round"/>

      <!-- Capital capture event markers -->
      <g transform="translate(295, 156)">
        <circle r="4.5" fill="#d4a74a" stroke="#181512" stroke-width="1.5"/>
        <text x="0" y="-10" text-anchor="middle" class="axis-txt" fill="#d4a74a">Gold HQ falls (24m)</text>
      </g>
      <g transform="translate(492, 6)">
        <circle r="5" fill="#5b8bd4" stroke="#fff8e6" stroke-width="1.5"/>
        <text x="-10" y="16" text-anchor="end" class="badge-txt" fill="#8fb8f5">VICTORY · 40:12</text>
      </g>
    </g>
  </g>
</svg>
